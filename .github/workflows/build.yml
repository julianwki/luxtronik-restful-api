name: Luxtronik Restful API CI

on: push

jobs:
  build:
    name: Build and Test Kotlin Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set JDK version
        id: read_property
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'java_version'

      - name: Set up JDK ${{ steps.read_property.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.read_property.outputs.java_version }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and Test with Gradle
        run: ./gradlew clean build --no-daemon
