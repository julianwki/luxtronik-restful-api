name: Kotlin CI

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: [ "main", "build-with-github-action" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test Kotlin Project
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the source code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the Java environment required for Kotlin/Gradle
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu' # Popular, reliable OpenJDK distribution

      # 3. Optimize builds by configuring Gradle caching automatically
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Ensure the Gradle wrapper has execution permissions on Linux
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Compile the Kotlin code and run all unit tests
      - name: Build and Test with Gradle
        run: ./gradlew clean build --no-daemon
