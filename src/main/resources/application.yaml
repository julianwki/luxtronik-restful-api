ktor:
  application:
    modules:
      - com.wiersbitzki.luxtronik.ApplicationKt.module
  deployment:
    port: 8080
service:
  websocket:
    host: "$LUXTRONIK_HOST:127.0.0.1"
    port: "$LUXTRONIK_PORT:8214"
    pin: "$LUXTRONIK_PIN:999999"
  modbus:
    host: "$LUXTRONIK_HOST:127.0.0.1"
    port: "$LUXTRONIK_PORT:502"
    unitId: 1
  heatingOffsetAdjustment:
    latitude: "$LOCATION_LAT:53.2525"
    longitude: "$LOCATION_LON:10.4144"
    timezone: "$TZ:Europe/Berlin"
    active: "$HEATING_OFFSET_ADJUSTMENT:false"
    temperature: "$HEATING_OFFSET_TEMPERATURE:apparent_temperature"
